# Static marketing site: no backend, so nothing is proxied.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Hashed build assets never change, so cache them aggressively
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Same fallback as the Firebase Hosting rewrite: unknown paths serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
